name: Fuzz autofix

# Attempt a fix for a failed scheduled/nightly fuzz run. This is deliberately
# conservative: it only runs when explicitly enabled, only on the default
# branch, only for faults attributed to Selium code, and it opens a draft PR
# for human review. It never merges.
#
# The prepare phase needs no GitHub write credential: it reproduces, mints a
# short-lived OpenCode token immediately before the agent, verifies, and commits
# locally. The GitHub App token is minted only afterwards, for the short
# push/PR phase, so an hour-long agent run cannot expire it.
#
# Requirements:
#   - repository variable FUZZ_AUTOFIX_ENABLED=true
#   - upstream secrets FUZZ_APP_ID and FUZZ_APP_PRIVATE_KEY for the installed
#     fuzz GitHub App (contents:write, pull-requests:write)
#   - id-token: write and an OpenCode Console workspace that trusts this
#     repository's GitHub OIDC token; no long-lived model key is stored
#   - an llvm symbolizer so the stack can distinguish selium from wasmtiny

on:
  workflow_run:
    workflows: ["Fuzz nightly"]
    types: [completed]

jobs:
  autofix:
    name: Auto-fix fuzz failure
    if: >-
      github.repository == 'seliumlabs/selium' &&
      vars.FUZZ_AUTOFIX_ENABLED == 'true' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: fuzz-autofix
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    env:
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
        env:
          RUSTFLAGS: ""
      - name: install opencode
        run: npm install --global @opencode/cli
      - name: download crash artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crashes"
          if ! gh run download "${{ github.event.workflow_run.id }}" \
            --pattern 'fuzz-artifacts-*' -D "$RUNNER_TEMP/crashes"; then
            echo "no crash artifacts in the failed run"
          fi
      - name: prepare fix
        id: prepare
        env:
          # Read-only token, used only for duplicate-PR checks. The agent child
          # unsets it before running.
          GH_TOKEN: ${{ github.token }}
          AUDIENCE: https://opencode.ai/console
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: scripts/fuzz-autofix-prepare.sh "$RUNNER_TEMP/crashes"
      - name: mint GitHub App token
        if: steps.prepare.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: publish fix PR
        if: steps.prepare.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET: ${{ steps.prepare.outputs.target }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          HASH: ${{ steps.prepare.outputs.hash }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: scripts/fuzz-autofix-publish.sh
