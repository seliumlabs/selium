[package]
name = "selium-guest-macros"
version.workspace = true
edition.workspace = true
description = "Selium guest procedural macros"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/ui/*.rs", "tests/ui-pass/*.rs"]

[lib]
proc-macro = true

[dependencies]
blake3 = { workspace = true }
proc-macro2 = { workspace = true, features = ["proc-macro"] }
quote = { workspace = true, features = ["proc-macro"] }
syn = { workspace = true, features = ["clone-impls", "full", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
selium-guest = { path = ".." }
selium-runtime = { path = "../../runtime" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
trybuild.workspace = true
wat.workspace = true

[lints]
workspace = true
