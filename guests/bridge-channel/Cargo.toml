[package]
name = "selium-bridge-channel"
version.workspace = true
edition.workspace = true
description = "Per-stream bridge channel system guest (attaches a relayed region and splices frames)"
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true, features = ["std"] }
selium-abi.workspace = true
selium-guest.workspace = true
selium-memory.workspace = true
selium-service.workspace = true
selium-shm.workspace = true
selium-wire.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[dev-dependencies]
selium-memory.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
